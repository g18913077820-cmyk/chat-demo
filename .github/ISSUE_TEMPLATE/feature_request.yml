name: 功能建议
description: 希望增加或改进的能力
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 先描述场景，再说想加什么功能
      placeholder: 会话超过 200 条后，找某次讨论很费劲……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你想象中这个功能怎么用
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 纯前端（不影响数据结构）
        - 需要改本地数据结构
        - 需要改同步协议
        - 不确定
